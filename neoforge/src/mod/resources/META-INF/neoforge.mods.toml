modLoader = "javafml"
loaderVersion = "[4,)"
license = "Polyform-Shield-1.0.0"

[[mods]]
modId = "sodium"

version = "${version}"
displayName = "Sodium"

iconFile = "sodium-icon.png" #optional

authors = "JellySquid (jellysquid3), IMS212"

credits = "bytzo, PepperCode1, FlashyReese, altrisi, Grayray75, Madis0, Johni0702, comp500, coderbot16, Moulberry, MCRcortex, Altirix, embeddedt, pajicadvance, Kroppeb, douira, burgerindividual, TwistedZero, Leo40Git, haykam821, muzikbike"

description = '''
Sodium is a powerful rendering engine for Minecraft which improves frame rates and reduces lag spikes.
'''

[modproperties.sodium]
"fabric-renderer-api-v1:contains_renderer" = true
"fabric:provides" = ["indium"]

[[mixins]]
config = "sodium-common.mixins.json"

[[mixins]]
config = "sodium-neoforge.mixins.json"

[[mixins]]
config = "sodium-frapi.mixins.json"
requiredMods = ["fabric_renderer_api_v1"]

[[dependencies.sodium]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2.10-beta,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.sodium]]
modId = "embeddium"
type = "incompatible"
reason = "Sodium and Embeddium cannot be used together. Please remove Embeddium."
versionRange = "[0.0.1,)"
ordering = "NONE"
side = "CLIENT"

# To also make "1.2.3+build" broken even if it's considered newer than "1.2.3" we use exclusive bound on the version following the broken one
[[dependencies.sodium]]
modId = "iris"
type = "incompatible"
reason = "This version of Iris is incompatible with this version of Sodium. Please update Iris."
versionRange = "(,1.11.8)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.sodium]]
modId = "fusion"
type = "incompatible"
reason = "This version of Fusion is incompatible with this version of Sodium. Please update Fusion to 1.3.16a or newer."
versionRange = "(,1.3.16+a)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.sodium]]
modId = "betterblockentities"
type = "incompatible"
reason = "This version of Better Block Entities is incompatible with this version of Sodium. Please update Better Block Entities."
versionRange = "(,1.4.1)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.sodium]]
modId = "moreculling"
type = "incompatible"
reason = "This version of More Culling is incompatible with this version of Sodium. Please update More Culling."
versionRange = "(,1.9.2)"
ordering = "NONE"
side = "CLIENT"
